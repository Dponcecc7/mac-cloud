name: Exportar dimensiones (Postgres -> Excel)

on:
  # El "schedule:" nativo de GitHub Actions se sacó (Davor, 2026-09-14) --
  # mismo problema ya documentado en pipeline_completo.yml: resultó poco
  # confiable (se detectó en producción un snapshot de Patrón Recurrente
  # desactualizado por horas pese al cron de cada 15 min) y, si se lo deja
  # activo junto al disparador externo de abajo, duplica ejecuciones sin
  # aportar nada. Ahora depende del mismo mecanismo que ya probó ser
  # confiable: cron-job.org -> GET /cron/exportar cada 5 min.
  workflow_dispatch: {}

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # mismo motivo que pipeline_completo.yml -- red de seguridad ante una corrida colgada
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Regenerar Excel de dimensiones desde Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python exportar_dimensiones.py
