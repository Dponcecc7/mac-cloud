name: Pipeline completo (nube, Fase 6)

on:
  # El "schedule:" nativo de GitHub Actions se sacó (Davor, 2026-08-29) --
  # era poco confiable (huecos de silencio de hasta 92 min, ver
  # project_mac_cloud_pendientes) y desde que existe el disparador externo
  # (cron-job.org -> GET /cron/pipeline cada 5 min) quedaba disparando en
  # paralelo con él, duplicando ejecuciones en el historial de Actions sin
  # aportar nada (la que llega segunda se frena sola por el db_lock).
  workflow_dispatch:
    inputs:
      dias_visitas:
        description: "Días hacia atrás a re-sincronizar a Postgres (normal = 10; usar más solo para un re-sync manual amplio, ej. tras corregir una regla de clasificación)"
        required: false
        default: "10"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pipeline completo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ATHENA_S3_STAGING: ${{ secrets.ATHENA_S3_STAGING }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          VENTANA_DIAS_VISITAS: ${{ github.event.inputs.dias_visitas || '10' }}
        run: python pipeline/pipeline_completo.py
