name: Pipeline completo (nube, Fase 6)

on:
  schedule:
    # 7:30am-4:30pm hora Peru (UTC-5) aprox = 12:00-21:55 UTC, cada 5 min, Lun-Sab
    - cron: "*/5 12-21 * * 1-6"
  workflow_dispatch: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pipeline completo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ATHENA_S3_STAGING: ${{ secrets.ATHENA_S3_STAGING }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python pipeline/pipeline_completo.py
