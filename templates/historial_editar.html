<!doctype html>
<html lang="es">
<head>
  <script>(function(){try{var t=localStorage.getItem('mac_theme');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAC — Editar cambio</title>
  <style>
    :root {
      --bg:#eef4fa; --card:#ffffff; --ink:#1e2a3a; --muted:#5b7186; --line:#d7e3ef;
      --brand:#2f6fb0; --ok:#16a34a; --ok-bg:#dcfce7; --bad:#dc2626; --bad-bg:#fee2e2;
    }
    * { box-sizing:border-box; }
    body { font-family:-apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); margin:0; }
    .wrap { max-width:560px; margin:0 auto; padding:0 24px 60px; }
    header.top { background:linear-gradient(135deg, #3a6ea5 0%, #5590c4 100%); color:#fff; padding:18px 28px; margin-bottom:22px; }
    header.top .inner { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    header.top .brand { font-weight:800; font-size:16px; display:flex; align-items:center; gap:8px; }
    header.top .brand .dot { width:9px; height:9px; border-radius:50%; background:#e8a15c; }
    h1.title { font-size:20px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:12.5px; margin:0 0 18px; }
    .panel { background:var(--card); border-radius:14px; padding:18px 20px; box-shadow:0 1px 3px rgba(35,25,10,.06); }
    label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px; }
    input, select, textarea {
      width:100%; padding:8px 10px; margin-bottom:12px; border:1px solid var(--line);
      border-radius:8px; box-sizing:border-box; font:inherit; font-size:13px; background:var(--bg); color:var(--ink);
    }
    .fila2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .acciones { display:flex; gap:8px; align-items:center; margin-top:4px; }
    button { padding:9px 16px; background:var(--brand); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:12.5px; }
    a.cancelar { color:var(--muted); font-size:12.5px; text-decoration:none; font-weight:600; }
    a.cancelar:hover { color:var(--ink); text-decoration:underline; }
    .flash { padding:9px 14px; border-radius:8px; margin-bottom:14px; font-size:13px; }
    .flash.error { background:var(--bad-bg); color:var(--bad); }
    .flash.ok { background:var(--ok-bg); color:var(--ok); }
  </style>
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</head>
<body>
  <header class="top">
    <div class="inner">
      <div class="brand"><span class="dot"></span> Proyecto MAC</div>
      <button type="button" class="theme-toggle">🌙</button>
    </div>
  </header>

  <div class="wrap">
    <h1 class="title">Editar cambio</h1>
    <p class="sub">{{ nombre|title }} · DNI {{ cambio.dni }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="panel">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>DNI</label>
        <input type="text" name="dni" value="{{ cambio.dni }}" required>
        <label>Campo</label>
        <select name="campo" required>
          {% for c in campos %}<option value="{{ c }}" {{ 'selected' if cambio.campo == c else '' }}>{{ c }}</option>{% endfor %}
        </select>
        <label>Valor nuevo</label>
        <input type="text" name="valor_nuevo" value="{{ cambio.valor_nuevo }}" required>
        <div class="fila2">
          <div>
            <label>Fecha desde</label>
            <input type="date" name="fecha_desde" value="{{ cambio.fecha_desde.isoformat() }}" required>
          </div>
          <div>
            <label>Fecha hasta (opcional)</label>
            <input type="date" name="fecha_hasta" value="{{ cambio.fecha_hasta.isoformat() if cambio.fecha_hasta else '' }}">
          </div>
        </div>
        <label>Día de la semana (opcional)</label>
        <select name="dia_semana">
          <option value="">Todos los días</option>
          {% for d in dias_semana %}<option value="{{ d }}" {{ 'selected' if cambio.dia_semana == d else '' }}>{{ d }}</option>{% endfor %}
        </select>
        <label>Comentario (opcional)</label>
        <textarea name="comentario" rows="2">{{ cambio.comentario or '' }}</textarea>
        <div class="acciones">
          <button type="submit">Guardar</button>
          <a class="cancelar" href="{{ url_for('historial.listar') }}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
