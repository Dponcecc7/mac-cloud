<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAC — Iniciar sesión</title>
  <style>
    * { box-sizing:border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#eef4fa; color:#1e2a3a; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:16px; }
    .card { background:#fff; border:1px solid #d7e3ef; border-radius:10px; padding:32px; width:100%; max-width:340px; box-shadow:0 8px 24px -12px rgba(33,28,22,.2); }
    h1 { font-size:18px; margin:0 0 20px; }
    label { display:block; font-size:13px; font-weight:600; color:#5b7186; margin-bottom:5px; }
    /* font-size:16px en los inputs evita que iOS Safari haga zoom automatico
       al enfocarlos (pasa si el tamano de letra es menor a 16px) -- min-height
       44px es el target tactil minimo recomendado para dedo en celular. */
    input { width:100%; padding:11px 12px; margin-bottom:16px; border:1px solid #d7e3ef; border-radius:8px; font:inherit; font-size:16px; min-height:44px; }
    button { width:100%; padding:13px; min-height:46px; background:#2f6fb0; color:#fff; border:none; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer; }
    .flash { padding:8px 10px; border-radius:6px; margin-bottom:14px; font-size:13px; }
    .flash.error { background:#fee2e2; color:#dc2626; }
    .flash.ok { background:#dcfce7; color:#16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MAC — Iniciar sesión</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Correo</label>
      <input type="email" name="email" required autofocus>
      <label>Contraseña</label>
      <input type="password" name="password" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
